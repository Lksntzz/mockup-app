appId: br.com.agenda.mockup
productName: Mockup da Agenda
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: Lksntzz
  repo: mockup-app
  releaseType: release
# Só o que o app precisa em tempo de execução. tools/, fixtures/, tests/, docs/ e Python ficam de fora.
# O código já vem empacotado pelo esbuild em dist/, então node_modules não entra.
files:
  - package.json
  - dist/**
  - pack/**
  - build/icon.png
  - "!**/*.map"
asar: true
# as artes da aba Personalizar ficam fora do asar: o Chromium da janela escondida lê as imagens direto da pasta
extraResources:
  - from: assets/artes
    to: artes
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Mockup-da-Agenda-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  language: "1046"
