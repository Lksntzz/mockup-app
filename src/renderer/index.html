<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:"
    />
    <title>Mockup da Agenda</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-estado="carregando-pacote">
    <header class="topo">
      <div class="marca" aria-hidden="true"><span class="marca-icone">M</span><span class="marca-nome">Mockup da Agenda</span></div>
      <button id="voltar" class="secundario" type="button" hidden>← Voltar ao início</button>
      <span id="nome-pdf" class="nome-pdf"></span>
      <span id="mensagem" class="mensagem" role="status"></span>
      <progress id="progresso" max="1" value="0" hidden></progress>
      <span id="versao" class="versao"></span>
      <button id="verificar" class="discreto" type="button">Verificar atualizações</button>
    </header>
    <div id="atualizacao" class="faixa-atualizacao" role="status" hidden>
      <span id="texto-atualizacao"></span>
      <button id="reiniciar" class="primario" type="button" hidden>Reiniciar e atualizar</button>
    </div>
    <main class="area">
      <aside id="coluna-capas" class="coluna lista-coluna" aria-label="Capas do PDF">
        <h2 class="titulo-coluna">Capas</h2>
        <div id="lista" class="lista"></div>
      </aside>
      <section class="centro">
        <div id="vazio" class="vazio">
          <div id="zona" class="zona" role="button" tabindex="0" aria-label="Escolher um PDF ou arrastar para cá">
            <div class="vazio-icone" aria-hidden="true">PDF</div>
            <p><strong>Arraste um PDF aqui</strong> ou <em>clique para escolher o arquivo</em>.</p>
            <p class="dica">Só as páginas ímpares viram capa (1, 3, 5...). As pares são o verso e são ignoradas.</p>
            <p class="dica">Os mockups serão salvos na pasta <strong>MKP</strong>, ao lado do PDF.</p>
          </div>
          <section id="em-andamento" class="em-andamento" hidden>
            <h2 class="titulo-coluna">Em andamento</h2>
            <div id="trabalhos"></div>
          </section>
        </div>
        <div id="abas" class="abas" role="group" aria-label="Qual lado mostrar" hidden>
          <button id="aba-frente" type="button" aria-pressed="true">Frente</button>
          <button id="aba-verso" type="button" aria-pressed="false">Verso</button>
        </div>
        <canvas id="previa" class="previa" hidden></canvas>
      </section>
      <aside id="painel" class="coluna painel" aria-label="Cores da capa" hidden>
        <h2 id="titulo-capa" class="titulo-coluna">Capa</h2>
        <div id="grupos"></div>
        <fieldset id="saidas" class="saidas">
          <legend>Imagens a gerar</legend>
          <label><input id="saida-frente" type="checkbox" checked /> Frente</label>
          <label><input id="saida-vt" type="checkbox" /> Especificação VT (com envelope)</label>
          <label><input id="saida-sem-canguru" type="checkbox" /> Especificação sem canguru</label>
          <label><input id="saida-verso" type="checkbox" /> Verso (página par do PDF)</label>
        </fieldset>
        <div class="acoes">
          <button id="copiar" class="secundario" type="button">Copiar estas cores para todas as capas</button>
          <button id="exportar" class="primario grande" type="button">Concluir e salvar</button>
        </div>
      </aside>
    </main>
    <div id="salvo" class="salvo" role="status" aria-live="polite" hidden>
      <div class="salvo-icone" aria-hidden="true">✓</div>
      <div class="salvo-titulo">Salvo</div>
      <div id="salvo-detalhe" class="salvo-detalhe"></div>
      <button id="salvo-ok" class="primario" type="button">OK</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
